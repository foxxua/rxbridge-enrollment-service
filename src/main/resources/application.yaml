management:
  endpoint:
    health:
      show-components: always
      show-details: when-authorized
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
spring:
  application:
    name: rxbridge-enrollment-service
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  threads:
    virtual:
      enabled: true
springdoc:
  default-produces-media-type: application/json
  paths-to-match:
    - /patients/**
    - /enrollments/**
    - /medications/**
rxbridge:
  time-zone: America/New_York
